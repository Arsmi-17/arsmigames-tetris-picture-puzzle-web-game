name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Puzzle and retry feasibility over many seeds
        run: npm run verify:puzzles
      - name: Worker bundles with the production config
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-dry-run

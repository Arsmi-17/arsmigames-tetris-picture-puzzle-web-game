name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Puzzle and retry feasibility over many seeds
        run: npm run verify:puzzles
      - name: Pages advanced-mode worker is in the build
        run: test -s dist/_worker.js
